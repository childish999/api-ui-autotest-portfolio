name: 接口测试

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: pip install -r requirements.txt

      - name: 跑接口测试
        run: pytest tests/test_read_posts.py tests/test_create_post.py tests/test_delete_lifecycle.py

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.html
